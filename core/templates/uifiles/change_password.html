{% extends "uifiles/base.html" %}
{% load static %}
{% block content %}


		<section
    class="login_register"
    style="
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
    "
>
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7 col-sm-10">

                <div class="register">

                    <h4 class="login_register_title text-center">
                        Change Password:
                    </h4>

                    {% if suserData %}
                    <form id="">

                        {% csrf_token %}
                     
                        <div class="form-group">
                            <input
                                type="text"
                                id="user_id"
                                value={{suserData.id}}
                                class="form-control requiredField input-label"
                                name="old_password"
                                
                            >
                        </div>
                     

                        <div class="form-group">
                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control requiredField input-label"
                                name="password"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="confirm_password">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm_password"
                                class="form-control requiredField input-label"
                                name="confirm_password"
                                required
                            >
                        </div>



                        <div class="form-group col-lg-12">
							<button class="btn_one" type="button" name="button" onclick="changepassword()">chnage password</button>
						</div>



                    </form>
                    {% endif %}

                </div>

            </div>

        </div>

    </div>
</section>
	
{% endblock %}
